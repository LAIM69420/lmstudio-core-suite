name: SearXNG Search

on:
  push:
    paths:
      - "plugins/searxng-search/**"
      - ".github/workflows/searxng-search.yml"
  pull_request:
    paths:
      - "plugins/searxng-search/**"
      - ".github/workflows/searxng-search.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/searxng-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/searxng-search/package-lock.json
      - run: npm ci
      - run: npm test
